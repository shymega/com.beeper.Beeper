app-id: com.automattic.Beeper
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: com.automattic.Beeper
separate-locales: false

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc

  # Networking
  - --share=network

  # GPU acceleration
  - --device=dri

  # Audio
  - --socket=pulseaudio

  # File access
  - --filesystem=xdg-download

  # Cursor theme passthrough
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

  # D-Bus: notifications & tray
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar

  # D-Bus: credential storage (keychain)
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd5
  - --talk-name=org.kde.kwalletd6

  # D-Bus: screen saver / power management
  - --talk-name=org.freedesktop.ScreenSaver
  - --system-talk-name=org.freedesktop.UPower

modules:
  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: beeper
    buildsystem: simple
    build-commands:
      - install -Dm755 apply_extra.sh ${FLATPAK_DEST}/bin/apply_extra
      - install -Dm755 com.automattic.beeper.sh ${FLATPAK_DEST}/bin/${FLATPAK_ID}
      - install -Dm644 com.automattic.beeper.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 com.automattic.beeper.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 com.automattic.beeper.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png
      - desktop-file-edit --set-icon="${FLATPAK_ID}" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - desktop-file-edit --set-key="Exec" --set-value="${FLATPAK_ID} %U" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop

    sources:
      - type: script
        dest_filename: apply_extra.sh
        commands:
          - chmod +x Beeper.AppImage
          - "offset=$(grep -aob -- 'hsqs' Beeper.AppImage | tail -n1 | cut -d: -f1)"
          - unsquashfs -quiet -no-progress -o $offset Beeper.AppImage
          - mv squashfs-root/* .
          - rm -rf Beeper.AppImage squashfs-root
      - type: script
        dest-filename: com.automattic.beeper.sh
        commands:
          - zypak-wrapper /app/extra/beepertexts/beepertexts "$@"
      - type: file
        path: com.automattic.beeper.sh
      - type: file
        path: com.automattic.beeper.desktop
      - type: file
        path: com.automattic.beeper.metainfo.xml
      - type: file
        path: com.automattic.beeper.png
      # x86_64 AppImage
      - type: extra-data
        filename: Beeper.AppImage
        only-arches: [x86_64]
        url: https://beeper-desktop.download.beeper.com/builds/Beeper-4.2.830-x86_64.AppImage
        sha256: 906ae49cf901da4a84ffd72160e0d121945ff2d4bb4283aaf9d32784a27a5430
        size: 236702820
        x-checker-data:
          type: rotating-url
          url: https://api.beeper.com/desktop/download/linux/x64/stable/com.automattic.beeper.desktop
          pattern: https://beeper-desktop.download.beeper.com/builds/Beeper-([0-9.]+)-x86_64.AppImage
      # aarch64 AppImage
      - type: extra-data
        filename: Beeper.AppImage
        only-arches: [aarch64]
        url: https://beeper-desktop.download.beeper.com/builds/Beeper-4.2.830-arm64.AppImage
        sha256: 821a69061c39da5dd4f1edb7b7b2dfee9df8a26ae6785f2fe4dd1e8771478aae
        size: 239859797
        x-checker-data:
          type: rotating-url
          url: https://api.beeper.com/desktop/download/linux/arm64/stable/com.automattic.beeper.desktop
          pattern: https://beeper-desktop.download.beeper.com/builds/Beeper-([0-9.]+)-arm64.AppImage
